<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudVault - My Audio</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/dashboard.css">
<style>
.audio-page {
max-width: 1200px;
margin: 40px auto;
padding: 0 20px;
}
.audio-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 25px;
gap: 15px;
flex-wrap: wrap;
}
.audio-header h1 {
margin: 0;
color: #2d3436;
font-size: 30px;
}
.back-dashboard {
display: inline-flex;
align-items: center;
gap: 7px;
text-decoration: none;
background: #2d3436;
color: white;
padding: 9px 17px;
border-radius: 20px;
font-size: 14px;
transition: 0.2s;
}
.back-dashboard:hover {
background: #000;
}
.audio-count {
background: white;
padding: 13px 18px;
border-radius: 10px;
margin-bottom: 25px;
box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
color: #636e72;
font-size: 14px;
}
.audio-count strong {
color: #2d3436;
}
.audio-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
gap: 22px;
}
.audio-card {
background: white;
border-radius: 12px;
overflow: hidden;
box-shadow: 0 4px 15px rgba(0, 0, 0, 0.09);
transition: transform 0.2s, box-shadow 0.2s;
}
.audio-card:hover {
transform: translateY(-3px);
box-shadow: 0 7px 20px rgba(0, 0, 0, 0.13);
}
.audio-preview {
width: 100%;
height: 180px;
background: #f1f2f6;
display: flex;
align-items: center;
justify-content: center;
flex-direction: column;
padding: 25px;
}
.audio-icon {
width: 90px;
height: 90px;
border-radius: 50%;
background: #2d3436;
color: white;
display: flex;
align-items: center;
justify-content: center;
font-size: 40px;
margin-bottom: 20px;
}
.audio-preview audio {
width: 100%;
max-width: 360px;
height: 45px;
}
.audio-info {
padding: 15px;
}
.audio-name {
font-size: 16px;
font-weight: 600;
color: #2d3436;
margin-bottom: 10px;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.audio-details {
font-size: 12px;
color: #777;
margin-bottom: 13px;
}
.audio-details div {
margin-bottom: 5px;
overflow: hidden;
text-overflow: ellipsis;
white-space: nowrap;
}
.audio-actions {
display: flex;
align-items: center;
gap: 6px;
}
.audio-actions a,
.audio-actions button {
flex: 0 0 auto;
min-width: 0;
padding: 7px 10px;
border: none;
border-radius: 6px;
cursor: pointer;
text-decoration: none;
text-align: center;
font-size: 12px;
line-height: 1;
transition: 0.2s;
}
.view-btn {
background: #0984e3;
color: white;
}
.view-btn:hover {
background: #076bb5;
}
.download-btn {
background: #00b894;
color: white;
}
.download-btn:hover {
background: #009b7d;
}
.delete-btn {
background: #d63031;
color: white;
}
.delete-btn:hover {
background: #b71c1c;
}
.delete-btn:disabled {
opacity: 0.6;
cursor: not-allowed;
}
.audio-actions form {
margin: 0;
padding: 0;
display: inline-block;
}
.empty-state {
background: white;
border-radius: 12px;
padding: 70px 20px;
text-align: center;
box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
}
.empty-state h2 {
color: #2d3436;
margin-bottom: 8px;
}
.empty-state p {
color: #777;
margin-bottom: 20px;
}
.upload-link {
display: inline-block;
text-decoration: none;
background: #2d3436;
color: white;
padding: 10px 20px;
border-radius: 22px;
font-size: 14px;
}
.upload-link:hover {
background: #000;
}
@media (max-width: 600px) {
.audio-page {
margin: 20px auto;
}
.audio-header {
flex-direction: column;
align-items: flex-start;
}
.audio-grid {
grid-template-columns: 1fr;
}
.audio-preview {
height: 200px;
}
}
</style>
</head>
<body>
<nav class="navbar-dashboard">
<div class="container">
<span class="brand">CloudVault</span>
<div class="nav-links">
<a href="/dashboard" class="btn-home">Dashboard</a>
<a href="/logout" class="btn-logout">Logout</a>
</div>
</div>
</nav>
<div class="audio-page">
<div class="audio-header">
<h1>My Audio</h1>
<a href="/dashboard" class="back-dashboard">Back to Dashboard</a>
</div>
<div class="audio-count">
You have <strong th:text="${fileCount}">0</strong> audio file(s) stored in CloudVault.
</div>
<div class="audio-grid" th:if="${files != null and !files.isEmpty()}">
<div class="audio-card" th:each="file : ${files}">
<div class="audio-preview">
<div class="audio-icon"></div>
<audio controls preload="metadata">
<source th:src="${file.cloudinaryUrl}" th:type="${file.mimeType}">
Your browser does not support audio playback.
</audio>
</div>
<div class="audio-info">
<div class="audio-name" th:title="${file.originalName}" th:text="${file.originalName}">audio.mp3</div>
<div class="audio-details">
<div>Type: <span th:text="${file.mimeType}">audio/mpeg</span></div>
<div>Size: <span class="file-size" th:attr="data-size=${file.fileSize}">0 KB</span></div>
<div>Uploaded: <span th:text="${#temporals.format(file.uploadDate, 'dd MMM yyyy HH:mm')}">05 Sep 2026 15:00</span></div>
</div>
<div class="audio-actions">
<a th:href="${file.cloudinaryUrl}" target="_blank" class="view-btn" title="View audio">View</a>
<a th:href="@{/download/{id}(id=${file.id})}" class="download-btn" title="Download audio">Download</a>
<form th:action="@{/delete/{id}(id=${file.id})}" method="post" onsubmit="return confirmDelete(this);">
<button type="submit" class="delete-btn" title="Delete audio">Delete</button>
</form>
</div>
</div>
</div>
</div>
<div class="empty-state" th:if="${files == null or files.isEmpty()}">
<h2>No Audio Found</h2>
<p>You haven't uploaded any audio files yet.</p>
<a href="/dashboard" class="upload-link">Upload Audio</a>
</div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
const sizeElements = document.querySelectorAll(".file-size");
sizeElements.forEach(function (element) {
const bytes = parseInt(element.getAttribute("data-size"));
if (isNaN(bytes)) {
element.textContent = "Unknown";
return;
}
let size;
let unit;
if (bytes < 1024) {
size = bytes;
unit = "B";
}
else if (bytes < 1024 * 1024) {
size = bytes / 1024;
unit = "KB";
}
else if (bytes < 1024 * 1024 * 1024) {
size = bytes / (1024 * 1024);
unit = "MB";
}
else {
size = bytes / (1024 * 1024 * 1024);
unit = "GB";
}
element.textContent = size.toFixed(2) + " " + unit;
});
});
function confirmDelete(form) {
const result = confirm(
"Are you sure you want to delete this audio file?\n\n"
+
"The audio will be permanently deleted from "
+
"Cloudinary and CloudVault."
);
if (!result) {
return false;
}
const button = form.querySelector("button");
if (button) {
button.disabled = true;
button.innerHTML = "Deleting...";
}
return true;
}
</script>
</body>
</html>
